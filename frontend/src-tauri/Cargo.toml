[package]
name = "truecount"
version = "0.1.0"
description = "TrueCount — Secure E-Voting Desktop Application"
authors = ["TrueCount Team"]
license = "MIT"
edition = "2021"

[lib]
name = "truecount_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "truecount"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri       = { version = "2", features = ["wry"], default-features = false }
tauri-plugin-opener = { version = "2" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
