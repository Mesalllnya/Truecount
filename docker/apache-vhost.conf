# TrueCount - Apache virtual host untuk container
# Disalin ke /etc/apache2/sites-available/000-default.conf

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/backend

    <Directory /var/www/html/backend>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Tolak akses langsung ke file dotfile (.env, .git, dsb).
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Batas body request (foto base64 + payload voting).
    LimitRequestBody 26214400

    # Log Apache ke stdout/stderr container agar terbaca `docker compose logs`.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
