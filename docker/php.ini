# TrueCount - konfigurasi PHP untuk container
# Disalin ke /usr/local/etc/php/conf.d/zz-truecount.ini

upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

date.timezone = Asia/Jakarta
expose_php = Off
display_errors = Off
log_errors = On

# Foto base64 & payload voting bisa lumayan besar; jangan potong input.
max_input_vars = 5000

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
# Image di-rebuild setiap deploy, jadi tidak perlu cek timestamp file.
opcache.validate_timestamps = 0
